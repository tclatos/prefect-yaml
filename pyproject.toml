[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefect-yaml"
version = "0.1.0"
description = "Declarative YAML DSL, typed contracts, and orchestration runtime for Prefect workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "prefect>=3.0.0",
    "pydantic>=2.7.0,<3",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.1",
    "pathspec>=0.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "xxhash>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
prefect-yaml = "prefect_yaml.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prefect_yaml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
